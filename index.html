<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Sleigh Delivery - 爆走サンタ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            border: 4px solid #ffd700;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 16px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #title {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff4444;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8), 0 0 20px #ff0000;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="title">🎅 爆走サンタ DELIVERY 🦌</div>
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div id="ui">
            <div>🎁 プレゼント: <span id="presentCount">0</span></div>
            <div>⚡ スピード: <span id="speed">0</span> km/h</div>
            <div>🔥 コンボ: <span id="combo">0</span>x</div>
        </div>
        <div id="instructions">
            ↑↓ 移動 | SPACE プレゼント投下 | 爆走してプレゼントをばらまけ！
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        const game = {
            speed: 500,
            maxSpeed: 1500,
            acceleration: 50,
            presentCount: 0,
            combo: 0,
            time: 0
        };

        // Santa and Sleigh
        const santa = {
            x: 150,
            y: 300,
            targetY: 300,
            width: 180,
            height: 80,
            bobOffset: 0
        };

        // Arrays for game objects
        let presents = [];
        let stars = [];
        let snowflakes = [];
        let speedLines = [];
        let explosions = [];
        let houses = [];
        let chimneys = [];

        // Initialize stars
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 2 + 1
            });
        }

        // Initialize snowflakes
        for (let i = 0; i < 50; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 4 + 2,
                speed: Math.random() * 3 + 2
            });
        }

        // Initialize houses
        for (let i = 0; i < 5; i++) {
            houses.push({
                x: canvas.width + i * 250,
                y: canvas.height - 100,
                width: 80 + Math.random() * 40,
                height: 60 + Math.random() * 40,
                color: ['#8B4513', '#A0522D', '#6B4423', '#8B0000'][Math.floor(Math.random() * 4)],
                hasChimney: true,
                chimneyX: 20 + Math.random() * 30
            });
        }

        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                throwPresent();
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        function throwPresent() {
            // Throw multiple presents for explosive effect
            for (let i = 0; i < 3; i++) {
                presents.push({
                    x: santa.x + 50,
                    y: santa.y + santa.height / 2 + (i - 1) * 20,
                    vx: -8 - Math.random() * 4,
                    vy: 2 + Math.random() * 3,
                    rotation: 0,
                    rotationSpeed: (Math.random() - 0.5) * 0.3,
                    size: 25 + Math.random() * 10,
                    color: ['#ff0000', '#00ff00', '#0066ff', '#ffff00', '#ff00ff'][Math.floor(Math.random() * 5)],
                    ribbon: ['#ffd700', '#ffffff', '#ff69b4'][Math.floor(Math.random() * 3)]
                });
            }
            game.presentCount += 3;

            // Create explosion effect
            for (let i = 0; i < 10; i++) {
                explosions.push({
                    x: santa.x + 60,
                    y: santa.y + santa.height / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: ['#ff0', '#f80', '#f00', '#fff'][Math.floor(Math.random() * 4)]
                });
            }
        }

        function drawSantaAndSleigh() {
            const bobY = Math.sin(game.time * 5) * 5;
            const x = santa.x;
            const y = santa.y + bobY;

            // Draw reindeer (2 of them for 爆走 feeling)
            drawReindeer(x - 80, y + 20, game.time);
            drawReindeer(x - 50, y + 10, game.time + 0.5);

            // Draw connection lines (reins)
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x - 40, y + 20);
            ctx.lineTo(x + 20, y + 30);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x - 70, y + 30);
            ctx.lineTo(x + 20, y + 35);
            ctx.stroke();

            // Draw sleigh
            drawSleigh(x + 20, y + 20);

            // Draw Santa on sleigh
            drawSanta(x + 50, y + 5);

            // Draw speed flames behind sleigh
            if (game.speed > 800) {
                drawFlames(x + 120, y + 40);
            }
        }

        function drawReindeer(x, y, timeOffset) {
            ctx.save();

            // Body
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(x, y, 25, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.ellipse(x - 30, y - 5, 12, 8, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Antlers
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x - 35, y - 12);
            ctx.lineTo(x - 45, y - 25);
            ctx.lineTo(x - 50, y - 22);
            ctx.moveTo(x - 45, y - 25);
            ctx.lineTo(x - 42, y - 30);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x - 28, y - 12);
            ctx.lineTo(x - 25, y - 28);
            ctx.lineTo(x - 30, y - 25);
            ctx.moveTo(x - 25, y - 28);
            ctx.lineTo(x - 20, y - 25);
            ctx.stroke();

            // Red nose (Rudolph!)
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(x - 42, y - 3, 4, 0, Math.PI * 2);
            ctx.fill();

            // Nose glow
            ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(x - 42, y - 3, 8, 0, Math.PI * 2);
            ctx.fill();

            // Legs (animated)
            ctx.fillStyle = '#8B4513';
            const legAnim = Math.sin(game.time * 15 + timeOffset) * 10;

            // Front legs
            ctx.fillRect(x - 15, y + 8, 4, 15 + legAnim);
            ctx.fillRect(x - 8, y + 8, 4, 15 - legAnim);

            // Back legs
            ctx.fillRect(x + 10, y + 8, 4, 15 - legAnim);
            ctx.fillRect(x + 17, y + 8, 4, 15 + legAnim);

            // Eye
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x - 32, y - 8, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawSleigh(x, y) {
            ctx.save();

            // Sleigh body
            ctx.fillStyle = '#cc0000';
            ctx.beginPath();
            ctx.moveTo(x, y + 30);
            ctx.quadraticCurveTo(x - 10, y + 35, x - 5, y + 40);
            ctx.lineTo(x + 70, y + 40);
            ctx.quadraticCurveTo(x + 85, y + 35, x + 80, y + 25);
            ctx.lineTo(x + 75, y + 10);
            ctx.lineTo(x + 10, y + 10);
            ctx.closePath();
            ctx.fill();

            // Sleigh decoration
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x + 5, y + 20);
            ctx.lineTo(x + 75, y + 20);
            ctx.stroke();

            // Runners
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(x - 10, y + 42);
            ctx.quadraticCurveTo(x - 15, y + 45, x - 10, y + 48);
            ctx.lineTo(x + 85, y + 48);
            ctx.quadraticCurveTo(x + 95, y + 45, x + 90, y + 42);
            ctx.lineTo(x - 10, y + 42);
            ctx.fill();

            ctx.restore();
        }

        function drawSanta(x, y) {
            ctx.save();

            // Body
            ctx.fillStyle = '#cc0000';
            ctx.beginPath();
            ctx.ellipse(x, y + 25, 20, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // Belt
            ctx.fillStyle = '#000';
            ctx.fillRect(x - 20, y + 20, 40, 8);
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(x - 5, y + 18, 10, 12);

            // Head
            ctx.fillStyle = '#ffdbac';
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.fill();

            // Hat
            ctx.fillStyle = '#cc0000';
            ctx.beginPath();
            ctx.moveTo(x - 15, y - 5);
            ctx.lineTo(x + 15, y - 5);
            ctx.lineTo(x + 20, y - 25);
            ctx.quadraticCurveTo(x + 5, y - 35, x - 5, y - 20);
            ctx.closePath();
            ctx.fill();

            // Hat trim
            ctx.fillStyle = '#fff';
            ctx.fillRect(x - 17, y - 8, 34, 6);

            // Hat pom-pom
            ctx.beginPath();
            ctx.arc(x + 20, y - 25, 6, 0, Math.PI * 2);
            ctx.fill();

            // Beard
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(x, y + 12, 12, 10, 0, 0, Math.PI);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x - 5, y - 2, 2, 0, Math.PI * 2);
            ctx.arc(x + 5, y - 2, 2, 0, Math.PI * 2);
            ctx.fill();

            // Rosy cheeks
            ctx.fillStyle = 'rgba(255, 100, 100, 0.5)';
            ctx.beginPath();
            ctx.arc(x - 10, y + 3, 4, 0, Math.PI * 2);
            ctx.arc(x + 10, y + 3, 4, 0, Math.PI * 2);
            ctx.fill();

            // Arm throwing presents (animated)
            ctx.fillStyle = '#cc0000';
            const armAngle = Math.sin(game.time * 8) * 0.3;
            ctx.save();
            ctx.translate(x - 15, y + 15);
            ctx.rotate(-0.5 + armAngle);
            ctx.fillRect(0, 0, 25, 8);
            // Glove
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(25, 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        function drawFlames(x, y) {
            for (let i = 0; i < 5; i++) {
                const flameX = x + i * 10 + Math.random() * 10;
                const flameY = y + (Math.random() - 0.5) * 20;
                const size = 10 + Math.random() * 15;

                const gradient = ctx.createRadialGradient(flameX, flameY, 0, flameX, flameY, size);
                gradient.addColorStop(0, 'rgba(255, 255, 0, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.6)');
                gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(flameX, flameY, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPresent(present) {
            ctx.save();
            ctx.translate(present.x, present.y);
            ctx.rotate(present.rotation);

            const s = present.size;

            // Box
            ctx.fillStyle = present.color;
            ctx.fillRect(-s/2, -s/2, s, s);

            // Ribbon vertical
            ctx.fillStyle = present.ribbon;
            ctx.fillRect(-s/8, -s/2, s/4, s);

            // Ribbon horizontal
            ctx.fillRect(-s/2, -s/8, s, s/4);

            // Bow
            ctx.beginPath();
            ctx.ellipse(-s/6, -s/2 - 5, s/4, s/6, -0.3, 0, Math.PI * 2);
            ctx.ellipse(s/6, -s/2 - 5, s/4, s/6, 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawHouse(house) {
            ctx.save();

            // House body
            ctx.fillStyle = house.color;
            ctx.fillRect(house.x, house.y - house.height, house.width, house.height);

            // Roof
            ctx.fillStyle = '#4a4a4a';
            ctx.beginPath();
            ctx.moveTo(house.x - 10, house.y - house.height);
            ctx.lineTo(house.x + house.width / 2, house.y - house.height - 40);
            ctx.lineTo(house.x + house.width + 10, house.y - house.height);
            ctx.closePath();
            ctx.fill();

            // Snow on roof
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(house.x - 10, house.y - house.height);
            ctx.lineTo(house.x + house.width / 2, house.y - house.height - 35);
            ctx.lineTo(house.x + house.width + 10, house.y - house.height);
            ctx.lineTo(house.x + house.width / 2, house.y - house.height - 30);
            ctx.closePath();
            ctx.fill();

            // Chimney
            ctx.fillStyle = '#8B0000';
            ctx.fillRect(house.x + house.chimneyX, house.y - house.height - 50, 20, 30);

            // Snow on chimney
            ctx.fillStyle = '#fff';
            ctx.fillRect(house.x + house.chimneyX - 2, house.y - house.height - 52, 24, 5);

            // Window
            ctx.fillStyle = '#ffff99';
            ctx.fillRect(house.x + 15, house.y - house.height + 15, 20, 25);
            ctx.fillRect(house.x + house.width - 35, house.y - house.height + 15, 20, 25);

            // Door
            ctx.fillStyle = '#4a2810';
            ctx.fillRect(house.x + house.width/2 - 12, house.y - 45, 24, 45);

            ctx.restore();
        }

        function update(deltaTime) {
            game.time += deltaTime;

            // Update speed (constantly accelerating for 爆走 feeling!)
            game.speed = Math.min(game.speed + game.acceleration * deltaTime, game.maxSpeed);

            // Santa movement
            if (keys['ArrowUp'] || keys['KeyW']) {
                santa.targetY = Math.max(80, santa.targetY - 400 * deltaTime);
            }
            if (keys['ArrowDown'] || keys['KeyS']) {
                santa.targetY = Math.min(canvas.height - 150, santa.targetY + 400 * deltaTime);
            }

            // Smooth movement
            santa.y += (santa.targetY - santa.y) * 5 * deltaTime;

            // Update stars
            stars.forEach(star => {
                star.x -= star.speed * (game.speed / 200);
                if (star.x < 0) {
                    star.x = canvas.width;
                    star.y = Math.random() * canvas.height;
                }
            });

            // Update snowflakes
            snowflakes.forEach(snow => {
                snow.x -= snow.speed * (game.speed / 150);
                snow.y += Math.sin(game.time * 2 + snow.x) * 0.5;
                if (snow.x < 0) {
                    snow.x = canvas.width;
                    snow.y = Math.random() * canvas.height;
                }
            });

            // Update speed lines
            if (game.speed > 600 && Math.random() < 0.3) {
                speedLines.push({
                    x: canvas.width,
                    y: Math.random() * canvas.height,
                    length: 50 + Math.random() * 100,
                    speed: game.speed / 50
                });
            }
            speedLines = speedLines.filter(line => {
                line.x -= line.speed;
                return line.x + line.length > 0;
            });

            // Update presents
            presents.forEach(present => {
                present.x += present.vx * (game.speed / 300);
                present.y += present.vy;
                present.vy += 0.2; // gravity
                present.rotation += present.rotationSpeed;
            });
            presents = presents.filter(p => p.y < canvas.height + 50 && p.x > -50);

            // Update explosions
            explosions.forEach(exp => {
                exp.x += exp.vx;
                exp.y += exp.vy;
                exp.life -= 0.02;
            });
            explosions = explosions.filter(e => e.life > 0);

            // Update houses
            houses.forEach(house => {
                house.x -= game.speed * deltaTime * 0.3;
                if (house.x + house.width < 0) {
                    house.x = canvas.width + Math.random() * 200;
                    house.width = 80 + Math.random() * 40;
                    house.height = 60 + Math.random() * 40;
                    house.color = ['#8B4513', '#A0522D', '#6B4423', '#8B0000'][Math.floor(Math.random() * 4)];
                    house.chimneyX = 20 + Math.random() * 30;
                }
            });

            // Check present-chimney collisions for combo
            presents.forEach(present => {
                houses.forEach(house => {
                    const chimneyX = house.x + house.chimneyX + 10;
                    const chimneyY = house.y - house.height - 50;
                    if (present.x > chimneyX - 15 && present.x < chimneyX + 15 &&
                        present.y > chimneyY - 10 && present.y < chimneyY + 20) {
                        game.combo++;
                        present.y = canvas.height + 100; // Remove present

                        // Celebration explosion
                        for (let i = 0; i < 15; i++) {
                            explosions.push({
                                x: chimneyX,
                                y: chimneyY,
                                vx: (Math.random() - 0.5) * 15,
                                vy: (Math.random() - 0.5) * 15,
                                life: 1,
                                color: ['#ff0', '#0f0', '#f0f', '#0ff', '#fff'][Math.floor(Math.random() * 5)]
                            });
                        }
                    }
                });
            });

            // Update UI
            document.getElementById('presentCount').textContent = game.presentCount;
            document.getElementById('speed').textContent = Math.floor(game.speed);
            document.getElementById('combo').textContent = game.combo;
        }

        function draw() {
            // Clear canvas with gradient sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0a2e');
            gradient.addColorStop(0.5, '#1a1a4e');
            gradient.addColorStop(1, '#2a2a6e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.globalAlpha = 0.5 + Math.sin(game.time * 3 + star.x) * 0.3;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Draw speed lines for 爆走 effect
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            speedLines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.x, line.y);
                ctx.lineTo(line.x + line.length, line.y);
                ctx.stroke();
            });

            // Draw moon
            ctx.fillStyle = '#ffffcc';
            ctx.beginPath();
            ctx.arc(canvas.width - 80, 80, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0a0a2e';
            ctx.beginPath();
            ctx.arc(canvas.width - 65, 75, 35, 0, Math.PI * 2);
            ctx.fill();

            // Draw ground (snow)
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            // Snow texture
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.fillStyle = '#e8e8e8';
                ctx.beginPath();
                ctx.arc(i + Math.sin(i) * 5, canvas.height - 50, 15, Math.PI, 0);
                ctx.fill();
            }

            // Draw houses
            houses.forEach(drawHouse);

            // Draw presents
            presents.forEach(drawPresent);

            // Draw Santa and Sleigh
            drawSantaAndSleigh();

            // Draw snowflakes (on top)
            ctx.fillStyle = '#fff';
            snowflakes.forEach(snow => {
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(snow.x, snow.y, snow.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Draw explosions
            explosions.forEach(exp => {
                ctx.globalAlpha = exp.life;
                ctx.fillStyle = exp.color;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, 5 * exp.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Draw speed burst effect when going really fast
            if (game.speed > 1000) {
                ctx.strokeStyle = `rgba(255, 215, 0, ${(game.speed - 1000) / 1000})`;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(santa.x + 50, santa.y + 30, 80 + Math.sin(game.time * 10) * 10, 0, Math.PI * 2);
                ctx.stroke();
            }

            // MERRY CHRISTMAS banner at high speed
            if (game.speed > 1200) {
                ctx.save();
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = `rgba(255, 215, 0, ${0.3 + Math.sin(game.time * 5) * 0.2})`;
                ctx.fillText('🎄 MERRY CHRISTMAS! 🎄', canvas.width / 2, 80);
                ctx.restore();
            }
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (deltaTime < 0.1) { // Prevent huge jumps
                update(deltaTime);
            }
            draw();

            requestAnimationFrame(gameLoop);
        }

        // Start the game
        requestAnimationFrame(gameLoop);

        // Auto-throw presents periodically for extra chaos
        setInterval(() => {
            if (game.speed > 800) {
                throwPresent();
            }
        }, 500);
    </script>
</body>
</html>
